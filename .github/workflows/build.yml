name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ekstrak project
        run: unzip -q -o ClockMorph.zip
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd ClockMorph && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ClockMorph-apk
          path: ClockMorph/app/build/outputs/apk/debug/app-debug.apk
